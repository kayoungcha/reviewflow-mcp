name: Complete Jira Issue

on:
  pull_request:
    types:
      - closed

concurrency:
  group: jira-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete-jira:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Show merged branches
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

        run: |
          echo "작업 브랜치: $HEAD_BRANCH"
          echo "대상 브랜치: $BASE_BRANCH"
      - name: Extract Jira issue key
        id: jira
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          ISSUE_KEY="$(
          printf '%s' "$HEAD_BRANCH" \
              | grep -Eio '[A-Z][A-Z0-9_]*-[0-9]+'\
              | head -n 1 \
              | tr '[:lower:]' '[:upper:]' \
              || true
              )"
            echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

            if [ -z "$ISSUE_KEY" ]; then
              echo "Jira 티켓 키가 없는 브랜치입니다."
            else
              echo "찾은 Jira 티켓: $ISSUE_KEY"
            fi
      - name: Check Jira issue status
        id: status

        # 앞 단계에서 Jira 키를 찾은 경우에만 실행합니다.
        if: steps.jira.outputs.issue_key != ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}

        run: |
          # 필요한 인증값이 모두 존재하는지 검사합니다.
          if [ -z "$JIRA_BASE_URL" ] ||
             [ -z "$JIRA_EMAIL" ] ||
             [ -z "$JIRA_API_TOKEN" ]; then
            echo "::error::Jira 인증 정보가 필요합니다."
            exit 1
          fi

          # 주소 마지막에 /가 있다면 제거합니다.
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          #Jira API에서 현재 티켓의 상태만 조회합니다.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY?fields=status" \
            --output jira-issue.json

          STATUS_CATEGORY="$(
            jq -r '.fields.status.statusCategory.key // empty' jira-issue.json
          )"

          if [ "$STATUS_CATEGORY" = "done" ]; then
            echo "Jira 티켓이 이미 완료 상태입니다."
            echo "already_done=true" >> "$GITHUB_OUTPUT"
          else 
            echo "현재 Jira 상태 분류: $STATUS_CATEGORY"
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Complete Jira issue
        # Jira 키가 있고, 아직 완료되지 않은 경우에만 실행합니다.
        if: >
          steps.jira.outputs.issue_key != '' &&
          steps.status.outputs.already_done == 'false'

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}

        run: |
          # 주소 마지막의 /를 제거합니다.
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          # 현재 티켓에서 가능한 상태 이동 목록을 조회합니다.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions" \
            --output jira-transitions.json

          # 이동 결과가 완료 카테고리인 transition ID를 찾습니다.
          TRANSITION_ID="$(
            jq -r '
              [
                .transitions[]
                | select(.to.statusCategory.key == "done")
              ][0].id // empty
            ' jira-transitions.json
          )"

          # 현재 상태에서 완료로 이동할 방법이 없다면 실패시킵니다.
          if [ -z "$TRANSITION_ID" ]; then
            echo "::error::완료 상태로 이동할 수 있는 Jira transition을 찾지 못했습니다."
            exit 1
          fi

          # 찾은 transition을 Jira에 실행 요청합니다.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions"

          echo "Jira 티켓을 완료 상태로 변경했습니다: $ISSUE_KEY"

  comment-unmerged-pr:
    # main 대상 PR이 머지되지 않고 닫힌 경우에만 실행합니다.
    if: >
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: 닫힌 PR 정보 확인
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CLOSED_BY: ${{ github.actor }}

        run: |
          echo "작업 브랜치: $HEAD_BRANCH"
          echo "PR 번호: $PR_NUMBER"
          echo "PR 제목: $PR_TITLE"
          echo "PR 주소: $PR_URL"
          echo "종료자: $CLOSED_BY"

      - name: Jira 티켓 키 추출
        id: jira

        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

        run: |
          # 브랜치명에서 Jira 티켓 키를 추출합니다.
          ISSUE_KEY="$(
            printf '%s' "$HEAD_BRANCH" \
              | grep -Eio '[A-Z][A-Z0-9_]*-[0-9]+' \
              | head -n 1 \
              | tr '[:lower:]' '[:upper:]' \
              || true
          )"

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          if [ -z "$ISSUE_KEY" ]; then
            echo "Jira 티켓 키가 없는 브랜치이므로 댓글 작성을 생략합니다."
          else
            echo "찾은 Jira 티켓: $ISSUE_KEY"
          fi

      - name: Jira에서 미병합 종료 댓글 작성
        if: steps.jira.outputs.issue_key != ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CLOSED_BY: ${{ github.actor }}

        run: |
          # Jira 인증 정보가 존재하는지 확인합니다.
          if [ -z "$JIRA_BASE_URL" ] ||
             [ -z "$JIRA_EMAIL" ] ||
             [ -z "$JIRA_API_TOKEN" ]; then
            echo "::error::Jira 인증 정보가 필요합니다."
            exit 1
          fi

          # 주소 마지막의 /를 제거합니다.
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          # Jira가 사용하는 ADF 형식의 댓글 JSON을 만듭니다.
          jq -n \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg closedBy "$CLOSED_BY" '
            {
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: "연결된 Pull Request가 병합되지 않고 종료되었습니다."
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("PR: #" + $number + " " + $title)
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("종료자: " + $closedBy)
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("PR 주소: " + $url)
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: "티켓 상태와 후속 작업 여부를 다시 확인해주세요."
                      }
                    ]
                  }
                ]
              }
            }
          ' > jira-comment.json

          # 생성한 댓글을 Jira 티켓에 등록합니다.
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data @jira-comment.json \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment"

          echo "Jira 티켓에 미병합 종료 댓글을 작성했습니다: $ISSUE_KEY"
