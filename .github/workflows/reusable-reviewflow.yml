name: Reusable ReviewFlow

on:
  workflow_call:
    inputs:
      reviewflow_server_url:
        description: ReviewFlow 서버 기본 주소
        required: true
        type: string

      jira_project_key:
        description: 선택적으로 연결할 Jira 프로젝트 키
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: reviewflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Draft PR과 외부 fork PR에서는 실행하지 않습니다.
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    env:
      REVIEWFLOW_API_URL: ${{ inputs.reviewflow_server_url }}/reviews/github
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Call ReviewFlow API
        env:
          JIRA_PROJECT_KEY: ${{ inputs.jira_project_key }}

        run: |
          set -euo pipefail

          # GitHub Actions가 현재 실행을 증명하는 임시 OIDC 토큰을 발급받습니다.
          OIDC_RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reviewflow-mcp"
          )"

          OIDC_TOKEN="$(
            printf '%s' "$OIDC_RESPONSE" |
              jq -r '.value // empty'
          )"

          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC 토큰을 발급받지 못했습니다."
            exit 1
          fi

          # 이후 로그에서 OIDC 토큰이 노출되지 않도록 가립니다.
          echo "::add-mask::$OIDC_TOKEN"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 180 \
              --output review-result.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$(
                jq -n \
                  --arg repositoryUrl "$REPOSITORY_URL" \
                  --argjson pullNumber "$PR_NUMBER" \
                  --arg jiraProjectKey "$JIRA_PROJECT_KEY" \
                  '{
                    repositoryUrl: $repositoryUrl,
                    pullNumber: $pullNumber
                  }
                  + (
                    if $jiraProjectKey == "" then
                      {}
                    else
                      {
                        jiraProjectKey: $jiraProjectKey
                      }
                    end
                  )'
                 )" \
                 "$REVIEWFLOW_API_URL"
          )"

          echo "ReviewFlow API HTTP 상태: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::ReviewFlow API 호출에 실패했습니다."
            cat review-result.json
            exit 1
          fi

          jq -e '
            .reviewer
            and .summary
            and (.positives | type == "array")
            and (.issues | type == "array")
            and .verdict
          ' review-result.json > /dev/null

      - name: Create review comment
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          COMMENT_MARKER="<!-- reviewflow-ai-review -->"

          {
            echo "$COMMENT_MARKER"
            echo "## ReviewFlow AI Code Review"
            echo
            echo "### 최종 판정"
            case "$(jq -r '.verdict' review-result.json)" in
              "통과")
                echo "✅ 통과"
                ;;
              "수정 권장")
                echo "🟡 수정 권장"
                ;;
              "수정 필요")
                echo "❌ 수정 필요"
                ;;
            esac
            echo
            echo "### Jira 티켓 요약"
            jq -r '.jiraSummary // "연결된 Jira 티켓 없음"' review-result.json
            echo
            echo "### 코드 리뷰"
            jq -r '.summary' review-result.json
            echo
            echo "### 👍 장점"

            if [ "$(jq '.positives | length' review-result.json)" -eq 0 ]; then
              echo "- 없음"
            else
              jq -r '.positives[] | "- \(.)"' review-result.json
            fi

            echo
            echo "### ⚠️ 개선점"

            if [ "$(jq '.issues | length' review-result.json)" -eq 0 ]; then
              echo "- 없음"
            else
              jq -r '.issues[] | "- \(.)"' review-result.json
            fi
          } > review-comment.md

          mapfile -t COMMENT_IDS < <(
            gh api \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq 'map(
                select(
                  .user.login == "github-actions[bot]"
                  and (.body | contains("<!-- reviewflow-ai-review -->"))
                )
              )
              | sort_by(.updated_at)
              | reverse
              | .[].id'
          )

          COMMENT_ID="${COMMENT_IDS[0]:-}"

          if [ -n "$COMMENT_ID" ]; then
            echo "기존 ReviewFlow 댓글을 갱신합니다."

            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              -F body=@review-comment.md

            for DUPLICATE_COMMENT_ID in "${COMMENT_IDS[@]:1}"; do
              echo "중복 ReviewFlow 댓글을 삭제합니다: $DUPLICATE_COMMENT_ID"

              gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/comments/$DUPLICATE_COMMENT_ID"
            done
          else
            echo "새 ReviewFlow 댓글을 생성합니다."

            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@review-comment.md
          fi

      - name: Apply review verdict
        run: |
          set -euo pipefail

          VERDICT="$(jq -r '.verdict' review-result.json)"

          case "$VERDICT" in
            "통과")
              echo "ReviewFlow 최종 판정: 통과"
              ;;

            "수정 권장")
              echo "::warning::ReviewFlow 최종 판정: 수정 권장"
              ;;

            "수정 필요")
              echo "::error::ReviewFlow 최종 판정: 수정 필요"
              exit 1
              ;;

            *)
              echo "::error::알 수 없는 ReviewFlow 판정입니다: $VERDICT"
              exit 1
              ;;
          esac
  jira-lifecycle:
    # Jira가 설정된 기본 브랜치 대상 PR만 처리합니다.
    # Draft PR은 건너뛰지만, Draft 상태에서 종료된 경우에는 종료 처리를 허용합니다.
    if: >
      inputs.jira_project_key != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (
        github.event.action == 'closed' ||
        github.event.pull_request.draft == false
      )

    runs-on: ubuntu-latest

    env:
      JIRA_LIFECYCLE_API_URL: ${{ inputs.reviewflow_server_url }}/jira/github-pull-request
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ACTION: ${{ github.event.action }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      JIRA_PROJECT_KEY: ${{ inputs.jira_project_key }}

    steps:
      - name: Call Jira lifecycle API
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=reviewflow-mcp"
          )"

          OIDC_TOKEN="$(
            printf '%s' "$OIDC_RESPONSE" |
              jq -r '.value // empty'
          )"

          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC 토큰을 발급받지 못했습니다."
            exit 1
          fi

          echo "::add-mask::$OIDC_TOKEN"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 120 \
              --output jira-lifecycle-result.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$(
                jq -n \
                  --arg repositoryUrl "$REPOSITORY_URL" \
                  --argjson pullNumber "$PR_NUMBER" \
                  --arg action "$PR_ACTION" \
                  --argjson merged "$PR_MERGED" \
                  --arg jiraProjectKey "$JIRA_PROJECT_KEY" \
                  '{
                    repositoryUrl: $repositoryUrl,
                    pullNumber: $pullNumber,
                    action: $action,
                    merged: $merged,
                    jiraProjectKey: $jiraProjectKey
                  }'
              )" \
              "$JIRA_LIFECYCLE_API_URL"
          )"

          echo "Jira lifecycle API HTTP 상태: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Jira lifecycle API 호출에 실패했습니다."
            cat jira-lifecycle-result.json
            exit 1
          fi

          echo "Jira lifecycle 처리 결과:"
          jq . jira-lifecycle-result.json
          if jq -e '
            .operations[]? |
            select(.result == "skipped_completed")
          ' jira-lifecycle-result.json > /dev/null; then
            ISSUE_KEY="$(
              jq -r '.issueKey // "알 수 없음"' jira-lifecycle-result.json
            )"

            echo "::warning::완료된 Jira 티켓은 검토 중으로 되돌리지 않고 건너뛰었습니다: $ISSUE_KEY"
          fi
