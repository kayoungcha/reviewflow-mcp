name: ReviewFlow AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

jobs:
  reviewflow:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    uses: ./.github/workflows/reusable-reviewflow.yml

    with:
      reviewflow_server_url: https://reviewflow-mcp.onrender.com
      jira_project_key: ${{ vars.REVIEWFLOW_JIRA_PROJECT_KEY }}
