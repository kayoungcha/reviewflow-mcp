name: Move Jira Issue to Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: jira-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  move-jira-to-review:
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Show pull request branches
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

        run: |
          echo "작업 브랜치: $HEAD_BRANCH"
          echo "대상 브랜치: $BASE_BRANCH"

      - name: Extract Jira Issue Key
        id: jira

        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

        run: |
          #브랜치명에서 MCPTEST-9 형태의 jira키를 찾습니다.
          ISSUE_KEY="$(
            printf '%s' "$HEAD_BRANCH" \
            | grep -Eio '[A-Z][A-Z0-9_]*-[0-9]+' \
            | head -n 1 \
            | tr '[:lower:]' '[:upper:]' \
            || true
          )"

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

          if [ -z "$ISSUE_KEY" ]; then
            echo "Jira 티켓 키가 없는 브랜치입니다."
          else
            echo "찾은 Jira 티켓: $ISSUE_KEY"
          fi

      - name: Jira 현재 상태 확인
        id: status

        if: steps.jira.outputs.issue_key != ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          REVIEW_STATUS_ID: ${{ vars.JIRA_REVIEW_STATUS_ID }}

        run: |
          # 필요한 인증값과 설정값이 모두 존재하는지 검사합니다.
          if [ -z "$JIRA_BASE_URL" ] || 
             [ -z "$JIRA_EMAIL" ] ||
             [ -z "$JIRA_API_TOKEN" ] || 
             [ -z "$REVIEW_STATUS_ID" ]; then
           echo "::error::Jira 인증 정보 또는 검토 상태 ID가 필요합니다."
           exit 1
          fi

          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY?fields=status" \
            --output jira-issue.json

          # 현재 상태의 고유 ID를 가져옵니다.
          CURRENT_STATUS_ID="$(
            jq -r '.fields.status.id // empty' jira-issue.json
          )"

          # 현재 상태가 완료 계열인지 확인합니다.
          CURRENT_STATUS_CATEGORY="$(
            jq -r '.fields.status.statusCategory.key // empty' jira-issue.json
          )"

          echo "현재 Jira 상태 분류: $CURRENT_STATUS_CATEGORY"

          # 완료된 티켓은 검토 중으로 되돌리지 않습니다.

          if [ "$CURRENT_STATUS_CATEGORY" = "done" ]; then
            echo "::error::완료된 Jira 티켓은 검토 중으로 되돌릴 수 없습니다: $ISSUE_KEY"
            exit 1
          fi

          echo "현재 Jira 상태 ID: $CURRENT_STATUS_ID"
          echo "검토 중 상태 ID: $REVIEW_STATUS_ID"

          if [ "$CURRENT_STATUS_ID" = "$REVIEW_STATUS_ID" ]; then
            echo "Jira 티켓이 이미 검토 중 상태입니다."
            echo "already_in_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "Jira 티켓을 검토 중으로 변경해야 합니다."
            echo "already_in_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Jira 티켓을 검토 중으로 변경
        if: >
          steps.jira.outputs.issue_key != '' &&
          steps.status.outputs.already_in_review == 'false'

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          REVIEW_STATUS_ID: ${{ vars.JIRA_REVIEW_STATUS_ID }}

        run: |
          # 주소 마지막의 / 제거합니다. 
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions" \
            --output jira-transitions.json

          TRANSITION_ID="$(
            jq -r \
              --arg statusId "$REVIEW_STATUS_ID" '
              [
                .transitions[]
                | select(.to.id == $statusId)
              ][0].id // empty
            ' jira-transitions.json
          )"

          if [ -z "$TRANSITION_ID" ]; then
            echo "::error::검토 중 상태로 이동할 수 있는 Jira transition을 찾지 못했습니다."
            exit 1
          fi

          echo "실행할 Jira transition ID: $TRANSITION_ID"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions"

          echo "Jira 티켓을 검토 중 상태로 변경했습니다: $ISSUE_KEY"

      - name: Jira에 PR 재개 댓글 작성
        if: >
          success() &&
          github.event.action == 'reopened' &&
          steps.jira.outputs.issue_key != ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REOPENED_BY: ${{ github.actor }}

        run: |
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          jq -n \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg reopenedBy "$REOPENED_BY" '
            {
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: "종료되었던 Pull Request가 다시 열렸습니다."
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("PR: #" + $number + " " + $title)
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("재개한 사람: " + $reopenedBy)
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("PR 주소: " + $url)
                      }
                    ]
                  }
                ]
              }
            }
          ' > jira-comment.json

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data @jira-comment.json \
            "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment"

          echo "Jira 티켓에 PR 재개 댓글을 작성했습니다: $ISSUE_KEY"
